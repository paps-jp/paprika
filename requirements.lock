# requirements.lock -- pinned, reproducible dependency set for the hub +
# worker images. This is the file the Dockerfiles install; requirements.txt
# stays as the human-editable *intent* (loose ranges).
#
# Generated from the known-good production hub image (paprika-hub:latest,
# python 3.13.13) on 2026-07-11 via:
#   docker run --rm --entrypoint pip paprika-hub:latest freeze > requirements.lock
#
# To bump a dependency: edit requirements.txt (the range), rebuild the image
# from it once, `pip freeze` the result back into this file, run the browser
# smoke path, then commit both files together. Do NOT hand-edit a single pin
# here without re-freezing the transitive closure.
#
# Runner image is NOT covered here -- it installs client/python only.


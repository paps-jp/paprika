# paprika learner -- the out-of-process learning system (outcome consumer).
#
# Reads the hub's per-job FACTS from the Redis Stream `paprika:learn:outcomes`
# (hub side: server/hub/_outcome_stream.py, Settings `outcome_stream_enabled`),
# judges each one with learner/verify.py and writes the outcome ledger
# (learn_template_stats_daily / learn_outcome_events) to MariaDB.
#
# It is NOT part of the hub: restarting or redeploying it never touches a hub
# or a worker, and the hub keeps running if it is down (events buffer in the
# capped stream; overflow drops the oldest).
#
#   cp learner/learner.env.example .env.learner   # fill in, keep out of git
#   docker compose -p learner -f docker-compose.learner.yml --env-file .env.learner up -d
#   docker compose -p learner -f docker-compose.learner.yml logs -f
#
# Reuses the paprika-hub image (python + redis-py + aiomysql already inside).
# `./server` is mounted read-only only for the pure URL-template function
# (server/hub/_page_role.templatize) so hub and learner share one key scheme.
services:
  learner:
    image: paprika-hub:latest
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-m", "learner"]
    environment:
      - PYTHONUNBUFFERED=1
      - LEARNER_REDIS_URL=${LEARNER_REDIS_URL:?set LEARNER_REDIS_URL}
      - LEARNER_MARIADB_HOST=${LEARNER_MARIADB_HOST:?set LEARNER_MARIADB_HOST}
      - LEARNER_MARIADB_PORT=${LEARNER_MARIADB_PORT:-3306}
      - LEARNER_MARIADB_USER=${LEARNER_MARIADB_USER:?set LEARNER_MARIADB_USER}
      - LEARNER_MARIADB_PASSWORD=${LEARNER_MARIADB_PASSWORD:?set LEARNER_MARIADB_PASSWORD}
      - LEARNER_MARIADB_DATABASE=${LEARNER_MARIADB_DATABASE:?set LEARNER_MARIADB_DATABASE}
      - LEARNER_MIN_VIDEO_S=${LEARNER_MIN_VIDEO_S:-60}
      - LEARNER_LOG_LEVEL=${LEARNER_LOG_LEVEL:-INFO}
      # Autopilot (playbook life cycle + Solver). All off unless set in
      # .env.learner; see learner/__main__.py for what each one does.
      - LEARNER_AUTOPILOT=${LEARNER_AUTOPILOT:-0}
      - LEARNER_SOLVER_ENABLED=${LEARNER_SOLVER_ENABLED:-0}
      - LEARNER_HUB_URL=${LEARNER_HUB_URL:-}
      - LEARNER_HUB_TOKEN=${LEARNER_HUB_TOKEN:-}
      - LEARNER_LLM_ENDPOINT=${LEARNER_LLM_ENDPOINT:-}
      - LEARNER_LLM_MODEL=${LEARNER_LLM_MODEL:-}
      - LEARNER_LLM_API_KEY=${LEARNER_LLM_API_KEY:-}
      - LEARNER_LLM_KIND=${LEARNER_LLM_KIND:-vision-chat}
      - LEARNER_LLM_THINKING=${LEARNER_LLM_THINKING:-}
      - LEARNER_LLM_MAX_TOKENS=${LEARNER_LLM_MAX_TOKENS:-1500}
      - LEARNER_WORKER_SECRET=${LEARNER_WORKER_SECRET:-}
      - LEARNER_TARGET_REASONS=${LEARNER_TARGET_REASONS:-overlay_wall}
      - LEARNER_SOLVER_DAILY_RUNS=${LEARNER_SOLVER_DAILY_RUNS:-40}
      - LEARNER_SOLVER_DAILY_TOKENS=${LEARNER_SOLVER_DAILY_TOKENS:-2000000}
      - LEARNER_TRIAL_PCT=${LEARNER_TRIAL_PCT:-20}
      - LEARNER_HOLDOUT_PCT=${LEARNER_HOLDOUT_PCT:-5}
    volumes:
      - ./learner:/app/learner:ro
      - ./server:/app/server:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
